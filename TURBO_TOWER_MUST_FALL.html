<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08080f">
<title>TURBO TOWER MUST FALL — 12 层电梯射击</title>
<style>
:root {
  --ink: #07070d;
  --panel: #0e0e19;
  --panel-2: #131324;
  --line: #2a2a44;
  --cream: #f8f4e3;
  --dim: #8a8aa8;
  --yellow: #ffd23f;
  --red: #ef476f;
  --cyan: #4cc9f0;
  --green: #7bf1a8;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--ink);
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 26px 18px 16px;
  overflow-x: hidden;
  color: var(--cream);
  font-family: "Courier New", "Cascadia Mono", Consolas, monospace;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(76, 201, 240, .10), transparent 52%),
    radial-gradient(ellipse at 82% 90%, rgba(239, 71, 111, .09), transparent 45%),
    #07070d;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .25;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(ellipse at center, black, transparent 78%);
}

.page-glow {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(1200px, 100vw);
  height: min(760px, 90vh);
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse, rgba(76, 201, 240, .07), transparent 65%);
  pointer-events: none;
  filter: blur(10px);
}

.cabinet {
  position: relative;
  z-index: 2;
  width: min(1180px, 96vw);
  border: 1px solid #27273d;
  background: linear-gradient(180deg, #12121f, #0a0a13 60%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.035) inset,
    0 30px 90px rgba(0,0,0,.65),
    0 0 70px rgba(76,201,240,.05);
  padding: 12px;
}

.cabinet-top,
.cabinet-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 32px;
  padding: 0 4px;
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.cabinet-top { padding-bottom: 10px; }
.cabinet-bottom { padding-top: 10px; align-items: flex-start; }

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--cream);
  font-weight: 700;
  white-space: nowrap;
}

.led {
  width: 7px;
  height: 7px;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  animation: led 2.6s steps(1) infinite;
}

@keyframes led {
  0%, 88%, 100% { opacity: 1; }
  90%, 96% { opacity: .2; }
}

.sep { color: #4a4a66; }

.tagline {
  color: var(--dim);
  text-align: right;
  white-space: nowrap;
}

.screen {
  position: relative;
  aspect-ratio: 16 / 9;
  width: 100%;
  overflow: hidden;
  background: #030308;
  border: 1px solid #30304a;
  box-shadow:
    0 0 0 4px #08080f,
    0 0 0 5px #222238,
    0 0 45px rgba(0,0,0,.9) inset;
  cursor: none;
  isolation: isolate;
}

canvas#game {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}

.crt {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, .16) 0px,
      rgba(0, 0, 0, .16) 1px,
      transparent 1px,
      transparent 3px
    );
  opacity: .52;
  mix-blend-mode: multiply;
}

.crt::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.36) 100%),
    linear-gradient(90deg, rgba(255, 70, 110, .035), transparent 22%, transparent 78%, rgba(70, 200, 255, .035));
  mix-blend-mode: normal;
}

.crt::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 18%;
  top: -20%;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,.035), transparent);
  animation: tube-roll 9s linear infinite;
}

@keyframes tube-roll {
  0% { top: -22%; }
  100% { top: 112%; }
}

.bezel {
  position: absolute;
  width: 14px;
  height: 14px;
  z-index: 6;
  pointer-events: none;
  border-color: rgba(255, 210, 63, .6);
  border-style: solid;
}
.bezel.tl { left: 9px; top: 9px; border-width: 1px 0 0 1px; }
.bezel.tr { right: 9px; top: 9px; border-width: 1px 1px 0 0; }
.bezel.bl { left: 9px; bottom: 9px; border-width: 0 0 1px 1px; }
.bezel.br { right: 9px; bottom: 9px; border-width: 0 1px 1px 0; }

.power-hint {
  position: absolute;
  left: 50%;
  bottom: 2.2%;
  transform: translateX(-50%);
  z-index: 7;
  padding: 6px 12px;
  border: 1px solid rgba(255, 210, 63, .55);
  background: rgba(7, 7, 13, .84);
  color: var(--yellow);
  font-size: clamp(7px, .8vw, 10px);
  letter-spacing: .2em;
  white-space: nowrap;
  pointer-events: none;
  transition: opacity .35s ease, transform .35s ease;
  animation: hint-pulse 1.8s ease-in-out infinite;
}

.power-hint.hidden {
  opacity: 0;
  transform: translate(-50%, 8px);
}

@keyframes hint-pulse {
  0%, 100% { box-shadow: 0 0 0 rgba(255,210,63,0); }
  50% { box-shadow: 0 0 20px rgba(255,210,63,.16); }
}

.cabinet-bottom .controls {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  color: var(--dim);
  letter-spacing: .02em;
  font-size: 10px;
  line-height: 1.8;
  text-transform: none;
}

.cabinet-bottom .controls b,
.cabinet-bottom .meta b {
  color: var(--cream);
  font-weight: 700;
}

.cabinet-bottom .meta {
  color: #656584;
  white-space: nowrap;
  letter-spacing: .06em;
  font-size: 9px;
  padding-top: 2px;
}

.farewell {
  position: relative;
  z-index: 2;
  margin-top: 13px;
  color: #4a4a63;
  font-size: 8px;
  letter-spacing: .28em;
  text-align: center;
  text-transform: uppercase;
}

.noscript {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 20;
  background: #07070d;
  color: var(--red);
  font-size: 16px;
}

.screen:fullscreen {
  width: 100vw;
  height: 100vh;
  border: 0;
  box-shadow: none;
  aspect-ratio: auto;
  background: #000;
}

.screen:-webkit-full-screen {
  width: 100vw;
  height: 100vh;
  border: 0;
  aspect-ratio: auto;
  background: #000;
}

.screen:fullscreen canvas#game {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

@media (max-width: 720px) {
  body { padding: 10px 8px; justify-content: flex-start; }
  .cabinet { width: 100%; padding: 7px; }
  .cabinet-top { padding-bottom: 6px; font-size: 8px; }
  .tagline { display: none; }
  .cabinet-bottom { padding-top: 6px; display: block; }
  .cabinet-bottom .controls { font-size: 8px; gap: 2px 10px; line-height: 1.7; }
  .cabinet-bottom .meta { margin-top: 5px; font-size: 8px; }
  .farewell { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .crt::after, .led, .power-hint { animation: none; }
}

</style>

<script>
'use strict';

/* ============================================================
   TURBO TOWER MUST FALL
   core.js — math, pixel font, synthesized audio
   ============================================================ */

const SCREEN_W = 640;
const SCREEN_H = 360;
const GROUND_Y = 322;
const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const chance = (p) => Math.random() < p;
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const sign = (v) => (v < 0 ? -1 : 1);
const aabb = (a, b) =>
  a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const pad = (n, len) => String(Math.max(0, Math.floor(n))).padStart(len, '0');
const approach = (v, target, delta) =>
  v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);

function hash01(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

/* ------------------------------------------------------------
   5x7 pixel font
   ------------------------------------------------------------ */

const FONT_GLYPHS = {
  'A': ['00100','01010','10001','11111','10001','10001','10001'],
  'B': ['11110','10001','10001','11110','10001','10001','11110'],
  'C': ['01111','10000','10000','10000','10000','10000','01111'],
  'D': ['11110','10001','10001','10001','10001','10001','11110'],
  'E': ['11111','10000','10000','11110','10000','10000','11111'],
  'F': ['11111','10000','10000','11110','10000','10000','10000'],
  'G': ['01111','10000','10000','10111','10001','10001','01111'],
  'H': ['10001','10001','10001','11111','10001','10001','10001'],
  'I': ['11111','00100','00100','00100','00100','00100','11111'],
  'J': ['00111','00010','00010','00010','10010','10010','01100'],
  'K': ['10001','10010','10100','11000','10100','10010','10001'],
  'L': ['10000','10000','10000','10000','10000','10000','11111'],
  'M': ['10001','11011','10101','10101','10001','10001','10001'],
  'N': ['10001','11001','10101','10011','10001','10001','10001'],
  'O': ['01110','10001','10001','10001','10001','10001','01110'],
  'P': ['11110','10001','10001','11110','10000','10000','10000'],
  'Q': ['01110','10001','10001','10001','10101','10010','01101'],
  'R': ['11110','10001','10001','11110','10100','10010','10001'],
  'S': ['01111','10000','10000','01110','00001','00001','11110'],
  'T': ['11111','00100','00100','00100','00100','00100','00100'],
  'U': ['10001','10001','10001','10001','10001','10001','01110'],
  'V': ['10001','10001','10001','10001','10001','01010','00100'],
  'W': ['10001','10001','10001','10101','10101','10101','01010'],
  'X': ['10001','10001','01010','00100','01010','10001','10001'],
  'Y': ['10001','10001','01010','00100','00100','00100','00100'],
  'Z': ['11111','00001','00010','00100','01000','10000','11111'],
  '0': ['01110','10011','10101','10101','10101','11001','01110'],
  '1': ['00100','01100','00100','00100','00100','00100','01110'],
  '2': ['01110','10001','00001','00010','00100','01000','11111'],
  '3': ['11110','00001','00001','01110','00001','00001','11110'],
  '4': ['00010','00110','01010','10010','11111','00010','00010'],
  '5': ['11111','10000','10000','11110','00001','00001','11110'],
  '6': ['01110','10000','10000','11110','10001','10001','01110'],
  '7': ['11111','00001','00010','00100','01000','01000','01000'],
  '8': ['01110','10001','10001','01110','10001','10001','01110'],
  '9': ['01110','10001','10001','01111','00001','00001','01110'],
  ' ': ['00000','00000','00000','00000','00000','00000','00000'],
  '.': ['00000','00000','00000','00000','00000','00100','00100'],
  ',': ['00000','00000','00000','00000','00100','00100','01000'],
  ':': ['00000','00100','00100','00000','00100','00100','00000'],
  ';': ['00000','00100','00100','00000','00100','00100','01000'],
  '!': ['00100','00100','00100','00100','00100','00000','00100'],
  '?': ['01110','10001','00001','00010','00100','00000','00100'],
  "'": ['00100','00100','00000','00000','00000','00000','00000'],
  '"': ['01010','01010','00000','00000','00000','00000','00000'],
  '-': ['00000','00000','00000','01110','00000','00000','00000'],
  '+': ['00000','00100','00100','11111','00100','00100','00000'],
  '/': ['00001','00010','00010','00100','01000','01000','10000'],
  '\\': ['10000','01000','01000','00100','00010','00010','00001'],
  '(': ['00010','00100','01000','01000','01000','00100','00010'],
  ')': ['01000','00100','00010','00010','00010','00100','01000'],
  '[': ['01110','01000','01000','01000','01000','01000','01110'],
  ']': ['01110','00010','00010','00010','00010','00010','01110'],
  '<': ['00010','00100','01000','10000','01000','00100','00010'],
  '>': ['01000','00100','00010','00001','00010','00100','01000'],
  '=': ['00000','00000','11111','00000','11111','00000','00000'],
  '%': ['11001','11010','00100','00100','01000','10110','00110'],
  '*': ['00000','10101','01110','11111','01110','10101','00000'],
  '#': ['01010','01010','11111','01010','11111','01010','01010'],
  '_': ['00000','00000','00000','00000','00000','00000','11111'],
  '|': ['00100','00100','00100','00100','00100','00100','00100'],
  '@': ['01110','10001','10111','10101','10111','10000','01110'],
  '$': ['00100','01111','10100','01110','00101','11110','00100'],
  '^': ['00100','01010','10001','00000','00000','00000','00000'],
  '~': ['00000','00000','01001','10110','00000','00000','00000'],
};

const FONT_ADVANCE = 6;
const FONT_HEIGHT = 7;
const _textCache = new Map();

function normalizeText(str) {
  return String(str)
    .toUpperCase()
    .replace(/×/g, 'X')
    .replace(/[—–]/g, '-')
    .replace(/[·•]/g, '*')
    .replace(/←/g, '<')
    .replace(/→/g, '>')
    .replace(/[^\x20-\x7E]/g, '?');
}

function textWidth(str, scale = 1) {
  const s = normalizeText(str);
  return Math.max(0, s.length * FONT_ADVANCE * scale - scale);
}

function makeTextCanvas(str, color, scale, outline, shadow) {
  const s = normalizeText(str);
  const padPx = outline ? scale : 0;
  const shadowPx = shadow ? scale : 0;
  const contentW = Math.max(1, s.length * FONT_ADVANCE * scale - scale);
  const w = contentW + padPx * 2 + shadowPx;
  const h = FONT_HEIGHT * scale + padPx * 2 + shadowPx;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;

  function paint(px, py, width, height, fill) {
    g.fillStyle = fill;
    g.fillRect(px, py, width, height);
  }

  const drawGlyphs = (dx, dy, fill) => {
    for (let i = 0; i < s.length; i++) {
      const glyph = FONT_GLYPHS[s[i]] || FONT_GLYPHS['?'];
      for (let row = 0; row < 7; row++) {
        for (let col = 0; col < 5; col++) {
          if (glyph[row][col] === '1') {
            paint(
              padPx + dx + i * FONT_ADVANCE * scale + col * scale,
              padPx + dy + row * scale,
              scale,
              scale,
              fill
            );
          }
        }
      }
    }
  };

  if (outline) {
    const o = scale;
    drawGlyphs(-o, 0, '#08080f');
    drawGlyphs(o, 0, '#08080f');
    drawGlyphs(0, -o, '#08080f');
    drawGlyphs(0, o, '#08080f');
    drawGlyphs(-o, -o, '#08080f');
    drawGlyphs(o, -o, '#08080f');
    drawGlyphs(-o, o, '#08080f');
    drawGlyphs(o, o, '#08080f');
  }
  if (shadow) drawGlyphs(scale, scale, 'rgba(5,5,10,.72)');
  drawGlyphs(0, 0, color);
  return { canvas: c, pad: padPx, contentW };
}

function drawText(str, x, y, opts) {
  const o = opts || {};
  const scale = o.scale || 1;
  const color = o.color || '#f8f4e3';
  const outline = !!o.outline;
  const shadow = !!o.shadow;
  const alpha = o.alpha == null ? 1 : o.alpha;
  const key = color + '|' + scale + '|' + (outline ? 1 : 0) + '|' + (shadow ? 1 : 0) + '|' + normalizeText(str);
  let entry = _textCache.get(key);
  if (!entry) {
    if (_textCache.size > 420) _textCache.clear();
    entry = makeTextCanvas(str, color, scale, outline, shadow);
    _textCache.set(key, entry);
  }
  const padPx = entry.pad;
  let dx = Math.round(x) - padPx;
  const w = entry.contentW;
  if (o.align === 'center') dx = Math.round(x - w / 2) - padPx;
  else if (o.align === 'right') dx = Math.round(x - w) - padPx;
  const dy = Math.round(y) - padPx;
  const prevAlpha = ctx.globalAlpha;
  ctx.globalAlpha = prevAlpha * alpha;
  ctx.drawImage(entry.canvas, dx, dy);
  ctx.globalAlpha = prevAlpha;
  return w;
}

/* ------------------------------------------------------------
   Audio — tiny synthesized arcade soundtrack + SFX
   ------------------------------------------------------------ */

const MUSIC_DATA = {
  title:   { root: 45, scale: [0, 2, 3, 5, 7, 9, 10], tempo: 92,  lead: 0.62, bass: 0.55, drums: 0.45 },
  lobby:   { root: 45, scale: [0, 2, 3, 5, 7, 9, 10], tempo: 132, lead: 0.70, bass: 0.72, drums: 0.72 },
  factory: { root: 41, scale: [0, 2, 3, 5, 7, 8, 10], tempo: 138, lead: 0.66, bass: 0.78, drums: 0.80 },
  server:  { root: 40, scale: [0, 2, 3, 7, 8, 10],    tempo: 126, lead: 0.58, bass: 0.68, drums: 0.58 },
  rooftop: { root: 38, scale: [0, 2, 3, 5, 7, 10],    tempo: 146, lead: 0.76, bass: 0.78, drums: 0.82 },
  boss:    { root: 36, scale: [0, 1, 3, 6, 7, 10],    tempo: 152, lead: 0.74, bass: 0.86, drums: 0.88 },
  victory: { root: 48, scale: [0, 4, 7, 9, 11],       tempo: 112, lead: 0.78, bass: 0.55, drums: 0.42 },
  danger:  { root: 34, scale: [0, 1, 3, 6, 8, 10],    tempo: 158, lead: 0.70, bass: 0.82, drums: 0.86 },
};

const AudioSys = {
  ctx: null,
  master: null,
  sfxBus: null,
  musicBus: null,
  noiseBuf: null,
  muted: false,
  musicOn: false,
  zone: 'title',
  step: 0,
  nextNote: 0,
  timer: null,
  lastHit: 0,
  lastShot: 0,

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.72;
      this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain();
      this.sfxBus.gain.value = 0.55;
      this.sfxBus.connect(this.master);
      this.musicBus = this.ctx.createGain();
      this.musicBus.gain.value = 0.22;
      this.musicBus.connect(this.master);

      const len = Math.floor(this.ctx.sampleRate * 0.6);
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

      this.startMusic(this.zone || 'title');
    } catch (e) {
      this.ctx = null;
    }
  },

  setMuted(m) {
    this.muted = !!m;
    if (this.master && this.ctx) {
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.72, this.ctx.currentTime, 0.025);
    }
  },

  tone(freq, dur, type, gain, slideTo, dest, delay) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(Math.max(20, freq), t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.08), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(0.02, dur));
    osc.connect(g).connect(dest || this.sfxBus);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  },

  noise(dur, gain, filterType, freq, endFreq, dest, delay) {
    if (!this.ctx || this.muted || !this.noiseBuf) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter();
    f.type = filterType || 'lowpass';
    f.frequency.setValueAtTime(freq || 1200, t0);
    if (endFreq) f.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.08), t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(dest || this.sfxBus);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  },

  shoot(kind) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastShot < 0.018) return;
    this.lastShot = now;
    if (kind === 'shotgun') {
      this.noise(0.18, 0.16, 'lowpass', 2400, 240);
      this.tone(120, 0.16, 'triangle', 0.13, 48);
    } else if (kind === 'smg') {
      this.tone(rt(560, 700), 0.035, 'square', 0.045, 220);
      this.noise(0.035, 0.04, 'highpass', 900);
    } else if (kind === 'rocket') {
      this.noise(0.28, 0.13, 'lowpass', 900, 120);
      this.tone(110, 0.24, 'sawtooth', 0.07, 48);
    } else if (kind === 'rail') {
      this.tone(1800, 0.16, 'sawtooth', 0.08, 280);
      this.tone(2400, 0.1, 'sine', 0.06, 800);
      this.noise(0.1, 0.05, 'highpass', 2400);
    } else {
      this.tone(rt(430, 520), 0.075, 'square', 0.075, 130);
      this.noise(0.045, 0.035, 'highpass', 1000);
    }
  },

  hit() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastHit < 0.03) return;
    this.lastHit = now;
    this.tone(rt(900, 1150), 0.035, 'square', 0.035, 500);
    this.noise(0.03, 0.03, 'highpass', 1600);
  },

  kill() {
    this.tone(300, 0.14, 'square', 0.08, 70);
    this.noise(0.14, 0.07, 'lowpass', 1400, 300);
  },

  explosion(big) {
    this.noise(big ? 0.55 : 0.34, big ? 0.26 : 0.16, 'lowpass', big ? 1100 : 1500, 70);
    this.tone(big ? 90 : 110, big ? 0.5 : 0.28, 'sine', big ? 0.2 : 0.12, 28);
    this.tone(big ? 160 : 200, 0.16, 'sawtooth', 0.05, 40);
  },

  hurt() {
    this.noise(0.18, 0.13, 'lowpass', 700, 120);
    this.tone(190, 0.28, 'sawtooth', 0.1, 60);
  },

  die() {
    this.noise(0.9, 0.24, 'lowpass', 1500, 60);
    this.tone(220, 0.8, 'sawtooth', 0.12, 35);
    this.tone(110, 0.9, 'square', 0.08, 25);
  },

  jump() {
    this.tone(260, 0.1, 'square', 0.055, 460);
  },

  land() {
    this.noise(0.06, 0.04, 'lowpass', 500);
  },

  dash() {
    this.noise(0.2, 0.1, 'bandpass', 600, 2400);
    this.tone(180, 0.16, 'sawtooth', 0.045, 600);
  },

  pickup() {
    const n = [523, 659, 784, 1046];
    n.forEach((f, i) => this.tone(f, 0.09, 'square', 0.055, null, null, i * 0.055));
  },

  health() {
    const n = [392, 523, 659];
    n.forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.075, null, null, i * 0.07));
  },

  ui() {
    this.tone(740, 0.045, 'square', 0.035, 980);
  },

  empty() {
    this.tone(160, 0.04, 'square', 0.035, 90);
  },

  bank() {
    const n = [523, 659, 784, 1046, 1318];
    n.forEach((f, i) => this.tone(f, 0.12, 'square', 0.06, null, null, i * 0.075));
  },

  risk() {
    this.tone(130, 0.5, 'sawtooth', 0.08, 520);
    this.tone(260, 0.5, 'square', 0.045, 1040);
    this.noise(0.5, 0.04, 'bandpass', 300, 2000);
  },

  bossRoar() {
    this.tone(70, 1.1, 'sawtooth', 0.16, 38);
    this.tone(105, 0.9, 'square', 0.07, 44);
    this.noise(0.9, 0.12, 'lowpass', 600, 100);
  },

  beam() {
    this.tone(1200, 0.22, 'sawtooth', 0.08, 320);
    this.noise(0.22, 0.06, 'bandpass', 2200, 600);
  },

  alarm() {
    this.tone(880, 0.12, 'square', 0.04, 660);
    this.tone(660, 0.12, 'square', 0.04, 880, null, 0.14);
  },

  wave() {
    this.tone(196, 0.1, 'square', 0.05, 392);
    this.tone(392, 0.16, 'triangle', 0.05, 784, null, 0.1);
  },

  setZone(zone) {
    this.zone = zone;
    if (!this.ctx) return;
    if (!this.musicOn) this.startMusic(zone);
  },

  startMusic(zone) {
    if (!this.ctx) return;
    if (zone) this.zone = zone;
    this.musicOn = true;
    this.step = 0;
    this.nextNote = this.ctx.currentTime + 0.08;
    if (!this.timer) {
      this.timer = setInterval(() => this.scheduleMusic(), 30);
    }
  },

  stopMusic() {
    this.musicOn = false;
  },

  scheduleMusic() {
    if (!this.ctx || !this.musicOn) return;
    const now = this.ctx.currentTime;
    let guard = 0;
    while (this.nextNote < now + 0.14 && guard < 24) {
      this.playStep(this.step, this.nextNote);
      const d = MUSIC_DATA[this.zone] || MUSIC_DATA.lobby;
      this.nextNote += 60 / d.tempo / 4;
      this.step++;
      guard++;
    }
  },

  playStep(step, when) {
    const d = MUSIC_DATA[this.zone] || MUSIC_DATA.lobby;
    const s = step % 16;
    const bar = Math.floor(step / 16) % 4;
    const delay = Math.max(0, when - this.ctx.currentTime);
    const mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);

    if (s % 4 === 0) {
      const k = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      k.type = 'sine';
      k.frequency.setValueAtTime(150, when);
      k.frequency.exponentialRampToValueAtTime(42, when + 0.16);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(0.13 * d.drums, when + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 0.22);
      k.connect(g).connect(this.musicBus);
      k.start(when);
      k.stop(when + 0.25);
    }
    if (s === 4 || s === 12) {
      this.noise(0.14, 0.055 * d.drums, 'bandpass', 1800, 700, this.musicBus, delay);
    }
    if (s % 2 === 1) {
      this.noise(0.03, 0.018 * d.drums, 'highpass', 6000, null, this.musicBus, delay);
    }

    const bassPattern = [0, -1, -1, 0, -1, 3, -1, 0, 0, -1, -1, 5, -1, 3, -1, 0];
    const bd = bassPattern[s];
    if (bd >= 0) {
      const oct = s === 8 ? 0 : s === 14 ? 12 : 0;
      const n = d.root + d.scale[bd % d.scale.length] + oct;
      this.tone(mtof(n), 0.2, 'triangle', 0.075 * d.bass, null, this.musicBus, delay);
      this.tone(mtof(n - 12), 0.22, 'square', 0.022 * d.bass, null, this.musicBus, delay);
    }

    if (s % 2 === 0) {
      const idx = (s * 3 + bar * 2 + Math.floor(step / 16)) % d.scale.length;
      const n = d.root + 24 + d.scale[idx] + (s === 10 ? 12 : 0);
      this.tone(mtof(n), 0.09, 'square', 0.026 * d.lead, null, this.musicBus, delay);
    }
    if (s === 0 && bar === 3) {
      this.tone(mtof(d.root + 12), 0.5, 'triangle', 0.04 * d.lead, null, this.musicBus, delay);
    }
  },
};

function rt(a, b) {
  return a + Math.random() * (b - a);
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function makeSprite(rows, palette) {
  const w = rows[0].length;
  const h = rows.length;
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  const g = cv.getContext('2d');
  const wc = document.createElement('canvas');
  wc.width = w;
  wc.height = h;
  const wg = wc.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      if (ch && ch !== '.' && ch !== ' ') {
        g.fillStyle = palette[ch] || '#ff00ff';
        g.fillRect(x, y, 1, 1);
        wg.fillStyle = '#ffffff';
        wg.fillRect(x, y, 1, 1);
      }
    }
  }
  return { canvas: cv, white: wc, w, h };
}

function drawSprite(spr, x, y, opts) {
  const o = opts || {};
  const scale = o.scale || 1;
  const w = spr.w * scale;
  const h = spr.h * scale;
  const img = o.flash ? spr.white : spr.canvas;
  const cx = Math.round(x + w / 2);
  const cy = Math.round(y);
  const prev = ctx.globalAlpha;
  if (o.alpha != null) ctx.globalAlpha = prev * o.alpha;
  ctx.save();
  ctx.translate(cx, cy);
  if (o.flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -Math.round(w / 2), 0, Math.round(w), Math.round(h));
  ctx.restore();
  ctx.globalAlpha = prev;
}

function drawGlow(x, y, r, color, alpha) {
  if (r <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(color, alpha));
  g.addColorStop(0.45, hexA(color, alpha * 0.4));
  g.addColorStop(1, hexA(color, 0));
  const prev = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = prev;
}

function drawHeart(x, y, filled, scale) {
  const s = scale || 2;
  const map = [
    '.11.11.',
    '1111111',
    '1111111',
    '.11111.',
    '..111..',
    '...1...',
  ];
  for (let row = 0; row < map.length; row++) {
    for (let col = 0; col < map[row].length; col++) {
      if (map[row][col] !== '1') continue;
      let c = '#2a2438';
      if (filled) c = row === 0 || (row === 1 && col < 3) ? '#ff8fa3' : '#ef476f';
      ctx.fillStyle = c;
      ctx.fillRect(x + col * s, y + row * s, s, s);
    }
  }
  if (filled) {
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(x + 1 * s, y + 1 * s, s, s);
  }
}

function drawWeaponIcon(name, x, y, color, scale) {
  const s = scale || 1;
  const c = color || (WEAPONS[name] && WEAPONS[name].color) || '#f8f4e3';
  const dark = '#1a1522';
  const rect = (rx, ry, rw, rh, fill) => {
    ctx.fillStyle = fill;
    ctx.fillRect(Math.round(x + rx * s), Math.round(y + ry * s), Math.max(1, rw * s), Math.max(1, rh * s));
  };
  if (name === 'shotgun') {
    rect(0, 3, 15, 2, c);
    rect(0, 2, 12, 1, '#f8f4e3');
    rect(2, 5, 3, 4, dark);
    rect(12, 3, 4, 1, dark);
    rect(0, 5, 2, 4, dark);
  } else if (name === 'smg') {
    rect(0, 3, 13, 3, c);
    rect(2, 6, 3, 5, dark);
    rect(1, 3, 1, 3, '#f8f4e3');
    rect(11, 2, 3, 1, dark);
    rect(5, 1, 4, 2, dark);
  } else if (name === 'rocket') {
    rect(0, 2, 16, 4, c);
    rect(14, 1, 3, 6, dark);
    rect(2, 6, 3, 5, dark);
    rect(0, 3, 2, 2, '#f8f4e3');
    rect(6, 1, 5, 1, dark);
  } else if (name === 'rail') {
    rect(0, 3, 18, 2, c);
    rect(3, 1, 2, 6, dark);
    rect(7, 1, 2, 6, dark);
    rect(11, 1, 2, 6, dark);
    rect(15, 2, 3, 4, '#f8f4e3');
  } else {
    rect(0, 3, 10, 3, c);
    rect(2, 5, 3, 4, dark);
    rect(9, 2, 3, 1, dark);
    rect(0, 3, 2, 1, '#f8f4e3');
  }
}

function drawBackground(floor, cam, t) {
  const z = ZONES[floor.zone];
  const grad = ctx.createLinearGradient(0, 0, 0, SCREEN_H);
  grad.addColorStop(0, z.skyTop);
  grad.addColorStop(0.72, z.skyBottom);
  grad.addColorStop(1, z.wallDark);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

  if (floor.zone === 'rooftop') drawRooftopBg(z, cam, t);
  else if (floor.zone === 'factory') drawFactoryBg(z, cam, t);
  else if (floor.zone === 'server') drawServerBg(z, cam, t);
  else drawLobbyBg(z, cam, t);

  // shared vignette / fog
  ctx.fillStyle = z.fog;
  ctx.globalAlpha = 0.035;
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  ctx.globalAlpha = 1;
}

function drawLobbyBg(z, cam, t) {
  const par = cam * 0.36;
  // window bays
  for (let i = 0; i < 6; i++) {
    const wx = i * 235 - par - 40;
    drawCityWindow(wx, 72, 188, 128, z, t + i * 2.1);
  }
  // pillars
  for (let i = 0; i < 5; i++) {
    const px = i * 280 - cam * 0.6 + 120;
    ctx.fillStyle = z.wallDark;
    ctx.fillRect(px, 32, 26, 290);
    ctx.fillStyle = z.wall;
    ctx.fillRect(px + 4, 32, 18, 290);
    ctx.fillStyle = hexA(z.trim, 0.18);
    ctx.fillRect(px + 7, 32, 2, 290);
    ctx.fillRect(px + 16, 32, 2, 290);
    ctx.fillStyle = z.wallLight;
    ctx.fillRect(px - 4, 36, 34, 8);
  }
  // ceiling light bars
  for (let i = 0; i < 5; i++) {
    const lx = i * 210 - cam * 0.48 + 80;
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(lx, 20, 90, 4);
    ctx.fillStyle = 'rgba(150,240,255,.45)';
    ctx.fillRect(lx + 8, 24, 74, 2);
    const g = ctx.createLinearGradient(lx, 26, lx, 150);
    g.addColorStop(0, 'rgba(120,230,255,.12)');
    g.addColorStop(1, 'rgba(120,230,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(lx + 8, 26);
    ctx.lineTo(lx + 82, 26);
    ctx.lineTo(lx + 108, 150);
    ctx.lineTo(lx - 18, 150);
    ctx.closePath();
    ctx.fill();
  }
  // TURBOSOFT sign
  const sx = 470 - cam * 0.52;
  ctx.globalAlpha = 0.42;
  drawText('TURBOSOFT', sx, 52, { scale: 2, color: hexA(z.trim, 0.9), outline: true, shadow: true });
  ctx.globalAlpha = 1;
  ctx.fillStyle = hexA(z.trim, 0.3);
  ctx.fillRect(sx, 68, 92, 1);
  drawText('TOWER  /  EST. 1998', sx, 73, { scale: 1, color: hexA(z.trim, 0.42) });

  // plants
  for (let i = 0; i < 3; i++) {
    const px = 110 + i * 330 - cam * 0.8;
    drawPlant(px, 286, z);
  }
  // wall panel seams
  ctx.strokeStyle = 'rgba(0,0,0,.16)';
  ctx.lineWidth = 1;
  for (let x = -((cam * 0.6) % 64); x < SCREEN_W; x += 64) {
    ctx.beginPath();
    ctx.moveTo(x + 0.5, 200);
    ctx.lineTo(x + 0.5, 322);
    ctx.stroke();
  }
}

function drawCityWindow(x, y, w, h, z, seed) {
  if (x > SCREEN_W || x + w < 0) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  const sky = ctx.createLinearGradient(0, y, 0, y + h);
  sky.addColorStop(0, '#07101f');
  sky.addColorStop(0.7, '#0e2a3e');
  sky.addColorStop(1, '#173a44');
  ctx.fillStyle = sky;
  ctx.fillRect(x, y, w, h);
  // moon
  ctx.fillStyle = 'rgba(210,245,255,.55)';
  ctx.beginPath();
  ctx.arc(x + w * 0.72, y + h * 0.24, 10, 0, TAU);
  ctx.fill();
  // skyline
  for (let i = 0; i < 12; i++) {
    const bh = 20 + hash01(seed + i * 13) * 58;
    const bw = 14 + hash01(seed + i * 7) * 20;
    const bx = x + i * 17 - 4;
    ctx.fillStyle = i % 3 === 0 ? '#0a1b2b' : '#081522';
    ctx.fillRect(bx, y + h - bh, bw, bh);
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(255,210,63,.35)';
      for (let wy = 0; wy < 5; wy++) {
        for (let wx = 0; wx < 2; wx++) {
          if (hash01(seed + i * 31 + wy * 9 + wx) > 0.55) {
            ctx.fillRect(bx + 4 + wx * 6, y + h - bh + 7 + wy * 8, 2, 3);
          }
        }
      }
    }
  }
  // rain streaks
  ctx.strokeStyle = 'rgba(140,220,255,.18)';
  for (let i = 0; i < 14; i++) {
    const rx = x + ((i * 37 + seed * 23) % w);
    const ry = y + ((i * 61 + seed * 9) % h);
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx - 2, ry + 8);
    ctx.stroke();
  }
  ctx.restore();
  // frame
  ctx.fillStyle = '#0a121b';
  ctx.fillRect(x - 5, y - 5, w + 10, 5);
  ctx.fillRect(x - 5, y + h, w + 10, 5);
  ctx.fillRect(x - 5, y, 5, h);
  ctx.fillRect(x + w, y, 5, h);
  ctx.fillStyle = hexA(z.trim, 0.35);
  ctx.fillRect(x - 3, y - 3, w + 6, 1);
  ctx.fillRect(x - 3, y + h + 2, w + 6, 1);
  ctx.fillStyle = '#152b34';
  ctx.fillRect(x + w / 2 - 1, y, 2, h);
}

function drawPlant(x, y, z) {
  ctx.fillStyle = '#1e2831';
  ctx.fillRect(x - 11, y + 18, 22, 16);
  ctx.fillStyle = '#2e3b45';
  ctx.fillRect(x - 11, y + 18, 22, 3);
  ctx.fillStyle = '#2f6f55';
  const leaves = [[-8, 2, 12], [2, -4, 14], [8, 6, 10], [-2, 10, 9], [-13, 10, 8]];
  for (let i = 0; i < leaves.length; i++) {
    const l = leaves[i];
    ctx.beginPath();
    ctx.ellipse(x + l[0], y + l[1], l[2] * 0.55, l[2], (i - 2) * 0.38, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = hexA(z.trim, 0.18);
  ctx.fillRect(x - 10, y + 30, 20, 1);
}

function drawFactoryBg(z, cam, t) {
  const par = cam * 0.55;
  // giant pipes
  for (let i = 0; i < 4; i++) {
    const y = 36 + i * 18;
    ctx.fillStyle = '#1c1114';
    ctx.fillRect(0, y, SCREEN_W, 10);
    ctx.fillStyle = '#3a2320';
    ctx.fillRect(0, y + 2, SCREEN_W, 4);
    ctx.fillStyle = hexA(z.trim, 0.15);
    ctx.fillRect(0, y + 3, SCREEN_W, 1);
  }
  // vertical pipes
  for (let i = 0; i < 4; i++) {
    const px = i * 230 - par + 80;
    ctx.fillStyle = '#1c1114';
    ctx.fillRect(px, 30, 18, 292);
    ctx.fillStyle = '#3b2521';
    ctx.fillRect(px + 3, 30, 8, 292);
    for (let j = 0; j < 9; j++) {
      ctx.fillStyle = '#221417';
      ctx.fillRect(px - 2, 54 + j * 30, 22, 5);
    }
  }
  // furnace windows
  for (let i = 0; i < 4; i++) {
    const x = i * 250 - cam * 0.34 + 30;
    const flick = 0.55 + Math.sin(t * 3 + i) * 0.1;
    drawGlow(x + 48, 210, 78, '#ff6b2c', 0.08 * flick);
    ctx.fillStyle = '#180d0d';
    ctx.fillRect(x, 160, 96, 82);
    ctx.fillStyle = hexA('#ff6b2c', 0.4 + flick * 0.15);
    ctx.fillRect(x + 7, 167, 82, 68);
    ctx.fillStyle = '#2a1512';
    for (let j = 0; j < 4; j++) ctx.fillRect(x + 7 + j * 22, 167, 3, 68);
    ctx.fillStyle = '#140b0c';
    ctx.fillRect(x - 4, 154, 104, 8);
  }
  // gears
  drawGear(170 - cam * 0.44, 120, 46, t * 0.3, '#2f1b1a', '#593025');
  drawGear(700 - cam * 0.38, 92, 32, -t * 0.45, '#2b1918', '#4c2a22');
  drawGear(830 - cam * 0.5, 190, 24, t * 0.2, '#291716', '#45251f');
  // warning band
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 294, SCREEN_W, 14);
  ctx.clip();
  ctx.fillStyle = '#160e10';
  ctx.fillRect(0, 294, SCREEN_W, 14);
  for (let x = -((cam * 0.7) % 28) - 28; x < SCREEN_W; x += 28) {
    ctx.fillStyle = hexA(z.trim, 0.6);
    ctx.beginPath();
    ctx.moveTo(x, 308);
    ctx.lineTo(x + 14, 294);
    ctx.lineTo(x + 28, 294);
    ctx.lineTo(x + 14, 308);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  // haze
  ctx.fillStyle = 'rgba(255,120,40,.035)';
  ctx.fillRect(0, 0, SCREEN_W, 360);
}

function drawGear(x, y, r, rot, c1, c2) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = c1;
  for (let i = 0; i < 8; i++) {
    ctx.rotate(TAU / 8);
    ctx.fillRect(-4, -r - 5, 8, 10);
  }
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fillStyle = c2;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.62, 0, TAU);
  ctx.fillStyle = '#160d0e';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.18, 0, TAU);
  ctx.fillStyle = c1;
  ctx.fill();
  ctx.restore();
}

function drawServerBg(z, cam, t) {
  const par = cam * 0.5;
  // racks
  for (let i = 0; i < 8; i++) {
    const x = i * 105 - par - 20;
    ctx.fillStyle = '#0d0a17';
    ctx.fillRect(x, 78, 88, 224);
    ctx.fillStyle = '#211936';
    ctx.fillRect(x + 4, 82, 80, 216);
    for (let row = 0; row < 12; row++) {
      const y = 88 + row * 17;
      ctx.fillStyle = '#0d0a17';
      ctx.fillRect(x + 8, y, 72, 12);
      for (let led = 0; led < 5; led++) {
        const on = hash01(i * 71 + row * 13 + led * 7 + Math.floor(t * 3)) > 0.5;
        ctx.fillStyle = on ? (led === 2 ? '#ff5d8f' : hexA(z.accent, 0.85)) : '#241b3b';
        ctx.fillRect(x + 13 + led * 12, y + 4, 3, 3);
      }
    }
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(x + 88, 78, 8, 224);
  }
  // cables
  ctx.strokeStyle = 'rgba(8,6,18,.9)';
  ctx.lineWidth = 3;
  for (let i = 0; i < 6; i++) {
    const cx = i * 130 - cam * 0.3 + 50;
    ctx.beginPath();
    ctx.moveTo(cx, 0);
    ctx.bezierCurveTo(cx + 30, 60, cx - 20, 100, cx + 10, 140);
    ctx.stroke();
  }
  // data rain
  ctx.save();
  for (let i = 0; i < 34; i++) {
    const x = (i * 41 - ((cam * 0.2) | 0)) % (SCREEN_W + 40);
    const speed = 18 + hash01(i) * 45;
    const y = ((t * speed + hash01(i * 3) * 400) % 420) - 40;
    ctx.fillStyle = hexA(i % 4 === 0 ? '#ff5d8f' : z.accent, 0.14 + hash01(i + 2) * 0.14);
    ctx.fillRect(x, y, 1, 6 + hash01(i * 5) * 9);
  }
  ctx.restore();
  // core glow
  drawGlow(320 - cam * 0.2, 200, 220, '#7b2cbf', 0.08);
  // vertical light strips
  for (let i = 0; i < 3; i++) {
    const x = 160 + i * 260 - cam * 0.65;
    ctx.fillStyle = hexA(z.trim, 0.1);
    ctx.fillRect(x, 40, 2, 282);
  }
}

function drawRooftopBg(z, cam, t) {
  // stars
  for (let i = 0; i < 70; i++) {
    const x = (i * 97 - cam * 0.08) % SCREEN_W;
    const y = (hash01(i * 7) * 210) | 0;
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.7 + i));
    ctx.fillStyle = 'rgba(255,240,220,' + (0.15 + tw * 0.35).toFixed(3) + ')';
    ctx.fillRect(x < 0 ? x + SCREEN_W : x, y, 1, 1);
  }
  // moon
  drawGlow(500 - cam * 0.06, 82, 110, '#ffd6a5', 0.06);
  ctx.fillStyle = '#ffe8c2';
  ctx.beginPath();
  ctx.arc(500 - cam * 0.06, 82, 31, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(190,140,120,.35)';
  ctx.beginPath();
  ctx.arc(490 - cam * 0.06, 74, 6, 0, TAU);
  ctx.arc(510 - cam * 0.06, 92, 9, 0, TAU);
  ctx.arc(514 - cam * 0.06, 70, 4, 0, TAU);
  ctx.fill();
  // distant skyline
  for (let i = 0; i < 18; i++) {
    const bw = 22 + hash01(i + 3) * 44;
    const bh = 40 + hash01(i * 9) * 120;
    const bx = i * 45 - cam * 0.18 - 20;
    ctx.fillStyle = i % 2 ? '#180c16' : '#230f18';
    ctx.fillRect(bx, 250 - bh, bw, bh + 80);
    ctx.fillStyle = 'rgba(255,180,120,.18)';
    for (let wy = 0; wy < 4; wy++) {
      for (let wx = 0; wx < 2; wx++) {
        if (hash01(i * 17 + wy * 3 + wx) > 0.5) {
          ctx.fillRect(bx + 6 + wx * 9, 250 - bh + 10 + wy * 14, 2, 3);
        }
      }
    }
  }
  // clouds
  ctx.fillStyle = 'rgba(255,120,130,.06)';
  for (let i = 0; i < 5; i++) {
    const x = i * 190 - cam * 0.12;
    ctx.beginPath();
    ctx.ellipse(x, 140 + i * 9, 90, 13, 0, 0, TAU);
    ctx.fill();
  }
  // antenna structures
  for (let i = 0; i < 3; i++) {
    const x = 90 + i * 330 - cam * 0.55;
    ctx.strokeStyle = 'rgba(20,10,18,.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, 322);
    ctx.lineTo(x + 6, 150);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 18, 190);
    ctx.lineTo(x + 6, 150);
    ctx.lineTo(x + 28, 190);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,80,90,.55)';
    ctx.fillRect(x + 4, 146, 4, 4);
  }
}

function drawForeground(cam, t) {
  // atmospheric haze and top/bottom tints, drawn over the world
  const g = ctx.createLinearGradient(0, 0, 0, SCREEN_H);
  g.addColorStop(0, 'rgba(3,3,8,.32)');
  g.addColorStop(0.18, 'rgba(3,3,8,0)');
  g.addColorStop(0.82, 'rgba(3,3,8,0)');
  g.addColorStop(1, 'rgba(3,3,8,.46)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

  // dust / sparks
  for (let i = 0; i < 14; i++) {
    const x = (i * 61 + t * (7 + i % 3) - cam * 0.2) % (SCREEN_W + 20);
    const y = (hash01(i * 9) * 340 + Math.sin(t + i) * 12) % SCREEN_H;
    ctx.fillStyle = 'rgba(255,240,210,.08)';
    ctx.fillRect((x + SCREEN_W) % SCREEN_W, y, 1, 1);
  }
}

function drawGround(floor) {
  const z = ZONES[floor.zone];
  ctx.fillStyle = '#08080f';
  ctx.fillRect(0, GROUND_Y, floor.width, SCREEN_H - GROUND_Y + 20);
  ctx.fillStyle = z.wallDark;
  ctx.fillRect(0, GROUND_Y, floor.width, 8);
  ctx.fillStyle = z.wallLight;
  ctx.fillRect(0, GROUND_Y, floor.width, 2);
  ctx.fillStyle = hexA(z.trim, 0.65);
  ctx.fillRect(0, GROUND_Y + 2, floor.width, 1);

  for (let x = 0; x < floor.width; x += 64) {
    ctx.fillStyle = x % 128 === 0 ? '#12121d' : '#0e0e18';
    ctx.fillRect(x, GROUND_Y + 10, 64, 26);
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(x, GROUND_Y + 10, 1, 26);
    ctx.fillStyle = 'rgba(255,255,255,.035)';
    ctx.fillRect(x + 4, GROUND_Y + 14, 54, 1);
    ctx.fillStyle = '#2a2a3c';
    ctx.fillRect(x + 6, GROUND_Y + 30, 2, 2);
    ctx.fillRect(x + 56, GROUND_Y + 30, 2, 2);
  }
  // hazard strip near lift
  const ex = floor.width - 78;
  ctx.save();
  ctx.beginPath();
  ctx.rect(ex - 24, GROUND_Y + 5, 116, 9);
  ctx.clip();
  ctx.fillStyle = '#15121a';
  ctx.fillRect(ex - 24, GROUND_Y + 5, 116, 9);
  for (let x = ex - 30; x < floor.width + 10; x += 14) {
    ctx.fillStyle = hexA(z.accent, 0.7);
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y + 14);
    ctx.lineTo(x + 7, GROUND_Y + 5);
    ctx.lineTo(x + 14, GROUND_Y + 5);
    ctx.lineTo(x + 7, GROUND_Y + 14);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawPlatforms(floor, t) {
  const z = ZONES[floor.zone];
  for (let i = 0; i < floor.platforms.length; i++) {
    const p = floor.platforms[i];
    // support brackets
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(p.x + 8, p.y + 10, 5, 14);
    ctx.fillRect(p.x + p.w - 13, p.y + 10, 5, 14);
    ctx.fillStyle = '#20202f';
    ctx.fillRect(p.x + 9, p.y + 10, 3, 10);
    ctx.fillRect(p.x + p.w - 12, p.y + 10, 3, 10);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(p.x + 3, p.y + p.h, p.w - 6, 4);
    // body
    ctx.fillStyle = '#242433';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#343448';
    ctx.fillRect(p.x, p.y, p.w, 4);
    ctx.fillStyle = '#4a4a64';
    ctx.fillRect(p.x + 2, p.y, p.w - 4, 1);
    ctx.fillStyle = hexA(z.trim, 0.72);
    ctx.fillRect(p.x + 4, p.y + 1, p.w - 8, 1);
    // warning stripes
    if (p.w >= 120) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(p.x + 14, p.y + 5, p.w - 28, 3);
      ctx.clip();
      for (let x = p.x + 8; x < p.x + p.w - 8; x += 12) {
        ctx.fillStyle = i % 2 ? hexA(z.accent, 0.6) : hexA(z.hazard, 0.45);
        ctx.fillRect(x, p.y + 5, 5, 3);
      }
      ctx.restore();
    }
    // bolts
    ctx.fillStyle = '#61617a';
    ctx.fillRect(p.x + 5, p.y + 6, 2, 2);
    ctx.fillRect(p.x + p.w - 7, p.y + 6, 2, 2);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillRect(p.x, p.y + 9, p.w, 1);
  }
}

function drawElevator(floor, open, t) {
  const z = ZONES[floor.zone];
  const ex = floor.width - 62;
  const ey = 132;
  const eh = GROUND_Y - ey;
  const ew = 62;

  // frame
  ctx.fillStyle = '#10101b';
  ctx.fillRect(ex - 12, ey - 18, ew + 24, eh + 18);
  ctx.fillStyle = '#242437';
  ctx.fillRect(ex - 8, ey - 14, ew + 16, eh + 14);
  ctx.fillStyle = '#34344d';
  ctx.fillRect(ex - 4, ey - 10, ew + 8, 4);

  // sign
  drawText('LIFT', ex + ew / 2, ey - 40, {
    scale: 1, color: open ? '#ffd23f' : '#6d6d88', align: 'center', outline: true,
  });
  // floor indicator
  ctx.fillStyle = '#07070d';
  ctx.fillRect(ex + 20, ey - 32, 24, 13);
  ctx.strokeStyle = '#34344d';
  ctx.strokeRect(ex + 20.5, ey - 31.5, 23, 12);
  drawText(pad(floor.no, 2), ex + 32, ey - 30, {
    scale: 1, color: open ? '#7bf1a8' : '#4d4d68', align: 'center',
  });

  // interior
  ctx.fillStyle = open ? '#2b2618' : '#0b0b13';
  ctx.fillRect(ex, ey, ew, eh);
  if (open) {
    const glow = ctx.createLinearGradient(ex, ey, ex, ey + eh);
    glow.addColorStop(0, 'rgba(255,210,63,.06)');
    glow.addColorStop(1, 'rgba(255,210,63,.28)');
    ctx.fillStyle = glow;
    ctx.fillRect(ex, ey, ew, eh);
    // back panel
    ctx.fillStyle = '#191a24';
    ctx.fillRect(ex + 9, ey + 30, ew - 18, eh - 34);
    ctx.fillStyle = '#25263a';
    ctx.fillRect(ex + 14, ey + 38, ew - 28, 36);
    drawText('UP', ex + ew / 2, ey + 50, { scale: 1, color: '#ffd23f', align: 'center' });
    ctx.fillStyle = hexA('#ffd23f', 0.5 + Math.sin(t * 4) * 0.2);
    ctx.fillRect(ex + ew / 2 - 2, ey + 16, 4, 4);
  }

  // doors
  const doorW = ew / 2;
  const slide = open ? doorW * 0.86 : 0;
  ctx.fillStyle = '#20202f';
  ctx.fillRect(ex + 1, ey + 1, doorW - 2 - slide, eh - 2);
  ctx.fillRect(ex + doorW + 1 + slide, ey + 1, doorW - 2 - slide, eh - 2);
  ctx.fillStyle = '#2c2c40';
  ctx.fillRect(ex + 5, ey + 5, doorW - 10 - slide, eh - 10);
  ctx.fillRect(ex + doorW + 5 + slide, ey + 5, doorW - 10 - slide, eh - 10);
  ctx.fillStyle = hexA(z.trim, open ? 0.55 : 0.2);
  ctx.fillRect(ex + ex * 0 + 6, ey + 8, 2, eh - 16);
  ctx.fillRect(ex + ew - 8, ey + 8, 2, eh - 16);
  // seam light
  ctx.fillStyle = open ? 'rgba(255,210,63,.5)' : 'rgba(76,201,240,.25)';
  ctx.fillRect(ex + doorW - slide, ey + 6, 1, eh - 12);
  ctx.fillRect(ex + doorW + slide, ey + 6, 1, eh - 12);
}

/* ------------------------------------------------------------
   Bosses
   ------------------------------------------------------------ */

function bossColor(b, color) {
  if (b.hitFlash > 0 && Math.floor(b.hitFlash * 90) % 2 === 0) return '#ffffff';
  return color;
}

function drawBoss(b, t) {
  if (!b) return;
  if (b.bossId === 'foreman') drawForeman(b, t);
  else if (b.bossId === 'archivist') drawArchivist(b, t);
  else drawCEO(b, t);

  if (!b.dead && b.phaseInvuln > 0) {
    ctx.save();
    ctx.strokeStyle = hexA(b.color, 0.55 + Math.sin(t * 22) * 0.25);
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.lineDashOffset = -t * 30;
    ctx.beginPath();
    ctx.ellipse(b.x + b.w / 2, b.y + b.h / 2, b.w * 0.8, b.h * 0.68, 0, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawForeman(b, t) {
  const x = Math.round(b.x), y = Math.round(b.y), w = b.w, h = b.h;
  const flash = bossColor(b, '#ff9f1c');
  const dark = bossColor(b, '#3b211f');
  const steel = bossColor(b, '#7b7d8f');
  const eye = bossColor(b, '#ffe66d');
  const walk = Math.sin(t * 8) * (Math.abs(b.vx) > 8 ? 2 : 0);
  ctx.save();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(x + w / 2, GROUND_Y + 2, w * 0.62, 5, 0, 0, TAU);
  ctx.fill();
  if (b.phase > 1) {
    drawGlow(x + w / 2, y + h / 2, 72, '#ff6b2c', 0.07 + Math.sin(t * 5) * 0.025);
  }
  // treads
  ctx.fillStyle = bossColor(b, '#1a1318');
  ctx.fillRect(x - 2, y + h - 16, w + 4, 16);
  ctx.fillStyle = flash;
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(x + 2 + ((i * 10 + (b.tread || 0) * 20) % (w - 4)), y + h - 12, 5, 8);
  }
  // legs
  ctx.fillStyle = dark;
  ctx.fillRect(x + 6, y + h - 30, 14, 18);
  ctx.fillRect(x + w - 20, y + h - 30 + walk, 14, 18);
  // torso
  ctx.fillStyle = bossColor(b, '#8a4d25');
  ctx.fillRect(x + 5, y + 14, w - 10, h - 38);
  ctx.fillStyle = flash;
  ctx.fillRect(x + 9, y + 18, w - 18, 6);
  // hazard chest
  ctx.fillStyle = bossColor(b, '#ffd23f');
  for (let i = 0; i < 4; i++) ctx.fillRect(x + 12 + i * 8, y + 30, 5, 4);
  // cockpit
  ctx.fillStyle = bossColor(b, '#2a1a22');
  ctx.fillRect(x + 16, y + 40, w - 32, 14);
  ctx.fillStyle = eye;
  ctx.fillRect(x + 22, y + 44, w - 44, 5);
  drawGlow(x + w / 2, y + 47, 22, '#ffe66d', 0.18);
  // head
  ctx.fillStyle = steel;
  ctx.fillRect(x + 13, y + 2, w - 26, 16);
  ctx.fillStyle = dark;
  ctx.fillRect(x + 16, y + 6, w - 32, 6);
  ctx.fillStyle = eye;
  ctx.fillRect(x + 19, y + 8, 6, 3);
  ctx.fillRect(x + w - 25, y + 8, 6, 3);
  // smokestack
  ctx.fillStyle = bossColor(b, '#5a3b2a');
  ctx.fillRect(x + w - 15, y - 9, 7, 13);
  ctx.fillStyle = 'rgba(200,200,200,.14)';
  ctx.beginPath();
  ctx.arc(x + w - 11 + Math.sin(t * 2) * 3, y - 16, 5, 0, TAU);
  ctx.fill();
  // arms
  ctx.fillStyle = dark;
  ctx.fillRect(x - 10, y + 26, 14, 12);
  ctx.fillRect(x + w - 4, y + 26, 14, 12);
  ctx.fillStyle = steel;
  ctx.fillRect(x - 13, y + 34, 12, 20);
  ctx.fillStyle = bossColor(b, '#ff5d73');
  ctx.fillRect(x + w + 1, y + 34, 14, 8);
  ctx.fillStyle = dark;
  ctx.fillRect(x + w + 11, y + 36, 6, 4);
  // antenna
  ctx.fillStyle = '#ff5d73';
  ctx.fillRect(x + 8, y - 6, 2, 8);
  ctx.restore();
}

function drawArchivist(b, t) {
  const x = b.x + b.w / 2;
  const y = b.y + b.h / 2;
  const flash = bossColor(b, '#e0aaff');
  const baseAlpha = b.alpha == null ? 1 : b.alpha;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = baseAlpha;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(0, GROUND_Y - y + 2, 34, 5, 0, 0, TAU);
  ctx.fill();
  // cables below
  ctx.strokeStyle = 'rgba(50,30,80,.7)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-20 + i * 10, 20);
    ctx.bezierCurveTo(-25 + i * 12, 70, 20 + i * 3, 100, -10 + i * 7, 140);
    ctx.stroke();
  }
  // outer rings
  for (let i = 0; i < 3; i++) {
    const r = 28 + i * 9;
    ctx.save();
    ctx.rotate(t * (0.6 + i * 0.35) * (i % 2 ? -1 : 1));
    ctx.strokeStyle = i === 1 ? flash : bossColor(b, '#7b2cbf');
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0.2, 1.2);
    ctx.arc(0, 0, r, Math.PI + 0.2, Math.PI + 1.2);
    ctx.stroke();
    ctx.fillStyle = bossColor(b, '#4cc9f0');
    for (let k = 0; k < 4; k++) {
      const a = (k / 4) * TAU;
      ctx.fillRect(Math.cos(a) * r - 1, Math.sin(a) * r - 1, 3, 3);
    }
    ctx.restore();
  }
  // body monolith
  ctx.fillStyle = bossColor(b, '#21132f');
  ctx.fillRect(-22, -26, 44, 52);
  ctx.fillStyle = bossColor(b, '#3c2358');
  ctx.fillRect(-18, -22, 36, 44);
  // eye
  ctx.fillStyle = bossColor(b, '#120a1a');
  ctx.beginPath();
  ctx.arc(0, -2, 13, 0, TAU);
  ctx.fill();
  const pulse = 0.6 + Math.sin(t * 4) * 0.2;
  ctx.fillStyle = bossColor(b, '#ff5d8f');
  ctx.beginPath();
  ctx.arc(0, -2, 7 + pulse * 2, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(-2, -5, 4, 4);
  drawGlow(0, -2, 30, '#ff5d8f', 0.18);
  // data plates
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = bossColor(b, i % 2 ? '#4cc9f0' : '#c77dff');
    ctx.globalAlpha = baseAlpha * 0.55;
    ctx.fillRect(-32 + i * 19, 28, 10, 2);
  }
  ctx.globalAlpha = baseAlpha;
  ctx.restore();
}

function drawCEO(b, t) {
  const jumpOff = b.jump > 0 ? -Math.sin(clamp(b.jump, 0, 1) * Math.PI) * 40 : 0;
  const x = Math.round(b.x), y = Math.round(b.y + jumpOff), w = b.w, h = b.h;
  const phase2 = b.hp / b.maxHp < 0.66;
  const phase3 = b.hp / b.maxHp < 0.33;
  const flash = bossColor(b, phase3 ? '#ff5d73' : '#ffd23f');
  const dark = bossColor(b, '#2a1824');
  const gold = bossColor(b, '#c99a2e');
  const walk = Math.sin(t * 6) * 1.5;
  ctx.save();
  // cape
  ctx.fillStyle = bossColor(b, '#7d1f38');
  ctx.beginPath();
  ctx.moveTo(x + 8, y + 24);
  ctx.quadraticCurveTo(x - 22 + Math.sin(t * 3) * 4, y + 48, x - 8, y + h + 4);
  ctx.lineTo(x + w + 8, y + h + 4);
  ctx.quadraticCurveTo(x + w + 20 + Math.sin(t * 2) * 4, y + 50, x + w - 8, y + 24);
  ctx.closePath();
  ctx.fill();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.36)';
  ctx.beginPath();
  ctx.ellipse(x + w / 2, GROUND_Y + 2, w * 0.7, 5, 0, 0, TAU);
  ctx.fill();
  // legs
  ctx.fillStyle = dark;
  ctx.fillRect(x + 12, y + h - 30, 12, 28);
  ctx.fillRect(x + w - 24, y + h - 30 + walk, 12, 28);
  ctx.fillStyle = bossColor(b, '#4a3040');
  ctx.fillRect(x + 6, y + h - 10, 24, 9);
  ctx.fillRect(x + w - 30, y + h - 10 + walk, 24, 9);
  // torso
  ctx.fillStyle = bossColor(b, '#3b2838');
  ctx.fillRect(x + 8, y + 20, w - 16, h - 46);
  ctx.fillStyle = gold;
  ctx.fillRect(x + 12, y + 26, w - 24, 7);
  ctx.fillStyle = bossColor(b, '#1a1018');
  ctx.fillRect(x + 17, y + 38, w - 34, 18);
  // core
  ctx.fillStyle = flash;
  ctx.fillRect(x + w / 2 - 5, y + 44, 10, 5);
  drawGlow(x + w / 2, y + 46, 26, phase3 ? '#ff5d73' : '#ffd23f', 0.2);
  // shoulders
  ctx.fillStyle = bossColor(b, '#6b4e2d');
  ctx.fillRect(x - 8, y + 18, 20, 18);
  ctx.fillRect(x + w - 12, y + 18, 20, 18);
  // head
  ctx.fillStyle = bossColor(b, '#e3c98e');
  ctx.fillRect(x + 18, y + 2, w - 36, 18);
  ctx.fillStyle = bossColor(b, '#171018');
  ctx.fillRect(x + 21, y + 7, w - 42, 7);
  ctx.fillStyle = bossColor(b, '#ff5d73');
  ctx.fillRect(x + 24, y + 9, 5, 3);
  ctx.fillRect(x + w - 29, y + 9, 5, 3);
  // crown
  ctx.fillStyle = gold;
  ctx.fillRect(x + 20, y - 7, w - 40, 7);
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(x + 22 + i * 8, y - 12, 4, 7);
  }
  // arm cannon
  ctx.fillStyle = dark;
  ctx.fillRect(x + w - 4, y + 32, 26, 12);
  ctx.fillStyle = bossColor(b, '#8a7a4f');
  ctx.fillRect(x + w + 14, y + 30, 14, 14);
  ctx.fillStyle = flash;
  ctx.fillRect(x + w + 24, y + 33, 6, 8);
  // antenna / halo
  if (phase2) {
    ctx.strokeStyle = hexA('#ffd23f', 0.45 + Math.sin(t * 5) * 0.2);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h / 2, 46 + Math.sin(t * 3) * 2, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

/* ------------------------------------------------------------
   Small prop drawing used by game.js
   ------------------------------------------------------------ */

function drawPickupCapsule(p, t) {
  const bob = Math.sin(t * 3 + p.seed) * 2;
  const x = p.x;
  const y = p.y + bob;
  if (p.type === 'weapon') {
    drawGlow(x + 8, y + 8, 24, WEAPONS[p.weapon].color, 0.16);
    ctx.fillStyle = '#0b0b13';
    ctx.fillRect(x, y, 17, 17);
    ctx.fillStyle = hexA(WEAPONS[p.weapon].color, 0.45);
    ctx.fillRect(x + 1, y + 1, 15, 1);
    ctx.fillRect(x + 1, y + 15, 15, 1);
    ctx.fillRect(x + 1, y + 1, 1, 15);
    ctx.fillRect(x + 15, y + 1, 1, 15);
    drawWeaponIcon(p.weapon, x + 1, y + 4, WEAPONS[p.weapon].color, 0.8);
    if (Math.sin(t * 5 + p.seed) > 0.2) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 14, y + 2, 1, 1);
    }
  } else if (p.type === 'health') {
    drawGlow(x + 7, y + 7, 20, '#ff5d73', 0.18);
    ctx.fillStyle = '#0b0b13';
    ctx.fillRect(x, y, 15, 15);
    ctx.fillStyle = '#ff5d73';
    ctx.fillRect(x + 2, y + 2, 11, 11);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 6, y + 4, 3, 7);
    ctx.fillRect(x + 4, y + 6, 7, 3);
  } else {
    drawGlow(x + 6, y + 6, 16, '#ffd23f', 0.15);
    ctx.fillStyle = '#0b0b13';
    ctx.fillRect(x, y, 13, 13);
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(x + 3, y + 3, 7, 7);
    ctx.fillStyle = '#1a1522';
    ctx.fillRect(x + 5, y + 5, 3, 3);
  }
}

<script>
'use strict';

try {

function persist() {

}

const keys = new Set();
const mouse = { x: SCREEN_W / 2, y: SCREEN_H / 2, down: false, inside: false };

const UI = {

function inRect(px, py, r) {

}

function hover(r) {

}

function makePlayer() {
  return {
    x: 70, y: GROUND_Y - 18, w: 12, h: 18, vx: 0, vy: 0,
    onGround: false, coyote: 0, jumpBuf: 0, facing: 1,
    hp: PLAYER_TUNE.maxHp, maxHp: PLAYER_TUNE.maxHp,
    weapon: 'pistol', ammo: Infinity,
    fireCd: 0, invuln: 0, hurtFlash: 0, dashT: 0, dashCd: 0,

}

function setupTitleWorld() {
  game.state = 'title';
  game.stateT = 0;
  game.titleT = 0;

  game.bullets = [];
  game.ebullets = [];
  game.particles = [];
  game.pickups = [];
  game.texts = [];
  game.spawners = [];
  game.warnings = [];
  game.beams = [];
  game.rings = [];
  game.ghosts = [];
  game.boss = null;
  game.waveActive = false;
  game.floorCleared = false;
  game.elevatorOpen = false;
  game.banner = null;
  game.score = 0;
  game.pot = 0;
  game.mult = 1;
  game.combo = 0;
  game.comboT = 0;
}

/* ------------------------------------------------------------
   Input
   ------------------------------------------------------------ */

function updateMouse(e) {
  const r = canvas.getBoundingClientRect();
  const scale = Math.min(r.width / SCREEN_W, r.height / SCREEN_H);
  const cw = SCREEN_W * scale;
  const ch = SCREEN_H * scale;
  const ox = (r.width - cw) / 2;
  const oy = (r.height - ch) / 2;
  mouse.x = clamp((e.clientX - r.left - ox) / scale, 0, SCREEN_W);
  mouse.y = clamp((e.clientY - r.top - oy) / scale, 0, SCREEN_H);
  mouse.inside = true;
}

function powerOn() {
  AudioSys.init();
  if (AudioSys.ctx) {
    if (game.state === 'title' || game.state === 'how') AudioSys.setZone('title');
    else if (game.floor) AudioSys.setZone(game.floor.zone);
  }
  if (powerHint) powerHint.classList.add('hidden');
}

function toggleMute() {
  save.muted = !save.muted;
  AudioSys.setMuted(save.muted);
  persist();
  AudioSys.ui();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    if (screenEl.requestFullscreen) screenEl.requestFullscreen().catch(() => {});
  } else if (document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
}

function togglePause() {
  if (game.state === 'paused') {
    game.state = game.pauseFrom || 'play';
    game.stateT = 0;
    mouse.down = false;
    setMusicDuck(false);
    AudioSys.ui();
  } else if (game.state === 'play' || game.state === 'intro') {
    game.pauseFrom = game.state;
    game.state = 'paused';
    game.stateT = 0;
    setMusicDuck(true);
    AudioSys.ui();
  }
}

function setMusicDuck(on) {
  if (AudioSys.ctx && AudioSys.musicBus) {
    AudioSys.musicBus.gain.setTargetAtTime(on ? 0.055 : 0.22, AudioSys.ctx.currentTime, 0.06);
  }
}

document.addEventListener('keydown', (e) => {
  const code = e.code;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(code)) {
    e.preventDefault();
  }
  if (e.repeat) {
    keys.add(code);
    return;
  }
  powerOn();
  keys.add(code);
  AudioSys.init();

  if (code === 'KeyM') {
    toggleMute();
    return;
  }
  if (code === 'KeyF') {
    toggleFullscreen();
    return;
  }

  const st = game.state;

  if (st === 'title') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') startRun();
    else if (code === 'KeyH') { game.state = 'how'; game.stateT = 0; AudioSys.ui(); }
    else if (code === 'Escape') { /* no-op */ }
    return;
  }
  if (st === 'how') {
    if (code === 'Escape' || code === 'Enter' || code === 'Space' || code === 'KeyH') {
      game.state = 'title';
      game.stateT = 0;
      AudioSys.ui();
    }
    return;
  }
  if (st === 'intro') {
    if ((code === 'Enter' || code === 'Space') && game.stateT > 0.55) beginPlay();
    else if (code === 'Escape') togglePause();
    return;
  }
  if (st === 'play') {
    if (code === 'Escape' || code === 'KeyP') { togglePause(); return; }
    if (code === 'Space') {
      if (game.player && !game.player.dead) game.player.jumpBuf = 0.12;
      return;
    }
    if (code === 'ShiftLeft' || code === 'ShiftRight') {
      tryDash();
      return;
    }
    if (code === 'KeyE') {
      if (game.floorCleared && game.player.x + game.player.w / 2 > game.floor.width - 166) {
        boardLift();
      }
      return;
    }
    return;
  }
  if (st === 'paused') {
    if (code === 'Escape' || code === 'KeyP') togglePause();
    else if (code === 'KeyR') startRun();
    else if (code === 'KeyQ') quitToTitle();
    else if (code === 'KeyM') toggleMute();
    return;
  }
  if (st === 'risk') {
    if (code === 'Digit1' || code === 'Numpad1' || code === 'KeyE') chooseBank();
    else if (code === 'Digit2' || code === 'Numpad2' || code === 'KeyR') chooseRisk();
    return;
  }
  if (st === 'gameover' || st === 'victory') {
    if (code === 'KeyR' || code === 'Enter' || code === 'Space' || code === 'NumpadEnter') startRun();
    else if (code === 'Escape') quitToTitle();
    return;
  }
});

document.addEventListener('keyup', (e) => {
  keys.delete(e.code);
  if (e.code === 'Space' && game.player && game.player.vy < 0 && game.state === 'play') {
    game.player.vy *= 0.52;
  }
});

window.addEventListener('blur', () => {
  keys.clear();
  mouse.down = false;
  if (game.state === 'play' || game.state === 'intro') togglePause();
});

canvas.addEventListener('mousemove', (e) => {
  updateMouse(e);
});

canvas.addEventListener('mouseleave', () => {
  mouse.inside = false;
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  updateMouse(e);
  powerOn();
  AudioSys.init();
  mouse.down = true;
  handlePointerDown();
});

window.addEventListener('pointerup', () => {
  mouse.down = false;
});

function handlePointerDown() {
  const mx = mouse.x;
  const my = mouse.y;
  const st = game.state;

  if (st === 'title') {
    if (inRect(mx, my, UI.title.mute)) { toggleMute(); return; }
    if (inRect(mx, my, UI.title.how)) { game.state = 'how'; game.stateT = 0; AudioSys.ui(); return; }
    startRun();
    return;
  }
  if (st === 'how') {
    game.state = 'title';
    game.stateT = 0;
    AudioSys.ui();
    return;
  }
  if (st === 'paused') {
    if (inRect(mx, my, UI.pause.resume)) togglePause();
    else if (inRect(mx, my, UI.pause.restart)) startRun();
    else if (inRect(mx, my, UI.pause.mute)) toggleMute();
    else if (inRect(mx, my, UI.pause.quit)) quitToTitle();
    return;
  }
  if (st === 'risk') {
    if (inRect(mx, my, UI.risk.bank)) chooseBank();
    else if (inRect(mx, my, UI.risk.risk)) chooseRisk();
    return;
  }
  if (st === 'gameover' || st === 'victory') {
    if (inRect(mx, my, UI.end.main)) startRun();
    else if (inRect(mx, my, UI.end.quit)) quitToTitle();
    return;
  }
  if (st === 'intro') {
    if (game.stateT > 0.55) beginPlay();
  }
}

/* ------------------------------------------------------------
   Run / floor lifecycle
   ------------------------------------------------------------ */

function startRun() {
  if (powerHint) powerHint.classList.add('hidden');
  AudioSys.init();
  if (AudioSys.ctx) {
    AudioSys.setZone('lobby');
    AudioSys.startMusic('lobby');
  }
  game.bestAtStart = save.best;
  game.score = 0;
  game.pot = 0;
  game.mult = 1;
  game.kills = 0;
  game.runTime = 0;
  game.combo = 0;
  game.comboT = 0;
  game.comboPulse = 0;
  game.floorIndex = 0;
  game.boss = null;
  game.newBest = false;
  game.lostPot = 0;
  game.victoryGain = 0;
  game.player = makePlayer();
  game.player.hp = PLAYER_TUNE.maxHp;
  game.player.weapon = 'pistol';
  game.player.ammo = Infinity;
  game.wave = 0;
  game.waveTotal = 0;
  game.waveActive = false;
  game.floorCleared = false;
  game.elevatorOpen = false;
  game.banner = null;
  game.pickups = [];
  game.enemies = [];
  game.bullets = [];
  game.ebullets = [];
  game.particles = [];
  game.texts = [];
  game.spawners = [];
  game.warnings = [];
  game.beams = [];
  game.rings = [];
  game.ghosts = [];
  game.deadT = 0;
  game.victoryDelay = 0;
  game.hitstop = 0;
  game.slowmo = 0;
  game.spawnSerial = 0;
  mouse.down = false;
  setMusicDuck(false);
  loadFloor(0);
}

function loadFloor(index) {
  const floor = FLOORS[index];
  floor.width = ARENA_W;
  game.floorIndex = index;
  game.floor = floor;
  game.state = 'intro';
  game.stateT = 0;
  game.floorTime = 0;
  game.spawnSerial = 0;
  game.wave = 0;
  game.waveTotal = floor.boss ? 1 : floor.waves.length;
  game.waveActive = false;
  game.waveClearDelay = 0;
  game.floorCleared = false;
  game.elevatorOpen = false;
  game.boss = null;
  game.enemies = [];
  game.bullets = [];
  game.ebullets = [];
  game.spawners = [];
  game.warnings = [];
  game.beams = [];
  game.rings = [];
  game.ghosts = [];
  game.particles = [];
  game.texts = [];
  game.pickups = [];
  game.banner = null;
  game.victoryDelay = 0;
  game.combo = 0;
  game.comboT = 0;
  game.shake = 0;
  game.flash = 0;
  game.deadT = 0;

  const p = game.player;
  p.x = floor.boss ? 156 : 70;
  p.y = GROUND_Y - p.h;
  p.vx = 0;
  p.vy = 0;
  p.onGround = true;
  p.coyote = 0.1;
  p.jumpBuf = 0;
  p.dashT = 0;
  p.dashCd = 0;
  p.fireCd = 0;
  p.invuln = 1.4;
  p.hurtFlash = 0;
  p.dead = false;
  p.inLift = false;
  p.aim = 0;
  game.cam = clamp(p.x + p.w / 2 - SCREEN_W / 2, 0, ARENA_W - SCREEN_W);

  addPickup({
    type: 'weapon',
    weapon: randomDrop(),
    x: floor.drop.x,
    y: floor.drop.y,
    life: 999,
  });
  if (floor.boss && p.hp < p.maxHp) {
    addPickup({
      type: 'health',
      x: Math.min(floor.width - 100, floor.drop.x + 120),
      y: GROUND_Y - 16,
      life: 999,
    });
  } else if (p.hp <= 3) {
    addPickup({
      type: 'health',
      x: Math.min(floor.width - 80, floor.drop.x + 130),
      y: GROUND_Y - 16,
      life: 999,
    });
  }

  if (AudioSys.ctx) {
    AudioSys.setZone(floor.boss ? 'danger' : floor.zone);
    AudioSys.startMusic(floor.boss ? 'danger' : floor.zone);
  }
  save.bestFloor = Math.max(save.bestFloor, floor.no);
  persist();
}

function beginPlay() {
  game.state = 'play';
  game.stateT = 0;
  mouse.down = false;
  if (game.floor.boss) {
    spawnBoss();
  } else {
    startWave();
  }
}

function startWave() {
  const floor = game.floor;
  if (!floor) return;
  if (floor.boss) {
    spawnBoss();
    return;
  }
  const list = floor.waves[game.wave];
  if (!list) return;
  for (let i = 0; i < list.length; i++) {
    const raw = list[i];
    const elite = raw.endsWith('*');
    const type = elite ? raw.slice(0, -1) : raw;
    spawnEnemy(type, elite, i * 0.11);
  }
  game.wave++;
  game.waveActive = true;
  game.waveClearDelay = 0;
  announce('WAVE ' + game.wave + ' / ' + game.waveTotal, game.wave === game.waveTotal ? 'FINAL WAVE' : '', '#ffd23f');
  AudioSys.wave();
}

function clearFloor() {
  if (game.floorCleared) return;
  game.floorCleared = true;
  game.waveActive = false;
  game.elevatorOpen = true;
  const bonus = 60 + game.floor.no * 10;
  game.pot += bonus;
  addText('FLOOR BONUS +' + bonus, game.player.x + 6, game.player.y - 18, '#ffd23f', 2);
  announce('LIFT UNLOCKED', 'HEAD RIGHT  ·  PRESS E', '#7bf1a8');
  game.ebullets = [];
  game.warnings = [];
  game.beams = [];
  game.shake = Math.max(game.shake, 5);
  AudioSys.wave();
  if (AudioSys.ctx) {
    AudioSys.setZone('victory');
    AudioSys.startMusic('victory');
  }
  if (game.floor.no === 12) {
    game.victoryDelay = 2.6;
  }
}

function boardLift() {
  if (game.state !== 'play' || !game.floorCleared) return;
  game.state = 'clear';
  game.stateT = 0;
  game.player.inLift = true;
  game.player.x = game.floor.width - 46;
  game.player.y = GROUND_Y - game.player.h;
  game.player.vx = 0;
  game.player.vy = 0;
  mouse.down = false;
  AudioSys.ui();
}

function chooseBank() {
  if (game.state !== 'risk') return;
  const gain = Math.round(game.pot * game.mult);
  game.score += gain;
  game.player.hp = Math.min(game.player.maxHp, game.player.hp + 1);
  game.pot = 0;
  game.mult = 1;
  game.newBest = game.score > save.best;
  if (game.score > save.best) save.best = game.score;
  persist();
  AudioSys.bank();
  addText('BANKED +' + gain, 320, 150, '#7bf1a8', 2);
  nextFloor();
}

function chooseRisk() {
  if (game.state !== 'risk') return;
  if (game.mult >= MAX_MULT) {
    AudioSys.empty();
    return;
  }
  game.mult = Math.min(MAX_MULT, game.mult * 2);
  AudioSys.risk();
  nextFloor();
}

function nextFloor() {
  game.floorIndex++;
  if (game.floorIndex >= FLOORS.length) {
    victory();
    return;
  }
  loadFloor(game.floorIndex);
}

function quitToTitle() {
  AudioSys.stopMusic();
  setMusicDuck(false);
  if (AudioSys.ctx) {
    AudioSys.setZone('title');
    AudioSys.startMusic('title');
  }
  mouse.down = false;
  setupTitleWorld();
}

function die() {
  if (!game.player || game.player.dead) return;
  const p = game.player;
  p.dead = true;
  p.hp = 0;
  game.lostPot = Math.round(game.pot * game.mult);
  game.state = 'dying';
  game.stateT = 0;
  game.deadT = 0;
  game.shake = 16;
  game.flash = 0.7;
  game.flashColor = '#ff3355';
  mouse.down = false;
  AudioSys.die();
  for (let i = 0; i < 40; i++) {
    addParticle(p.x + 6, p.y + 8, rand(-150, 150), rand(-180, 40), rand(1, 4), i % 3 ? '#ff5d73' : '#ffd23f', 0.9, 420, true);
  }
}

function gameOver() {
  game.state = 'gameover';
  game.stateT = 0;
  game.newBest = game.score > save.best;
  if (game.score > save.best) save.best = game.score;
  save.bestFloor = Math.max(save.bestFloor, game.floor.no);
  save.runs++;
  persist();
  AudioSys.stopMusic();
  mouse.down = false;
}

function victory() {
  if (game.state === 'victory') return;
  const gain = Math.round(game.pot * game.mult) + CLEAR_BONUS;
  game.score += gain;
  game.victoryGain = gain;
  game.pot = 0;
  game.mult = 1;
  game.state = 'victory';
  game.stateT = 0;
  game.newBest = game.score > save.best;
  if (game.score > save.best) save.best = game.score;
  save.bestFloor = 12;
  save.runs++;
  persist();
  setMusicDuck(false);
  if (AudioSys.ctx) {
    AudioSys.setZone('victory');
    AudioSys.startMusic('victory');
  }
  mouse.down = false;
  for (let i = 0; i < 60; i++) {
    addParticle(rand(40, 600), rand(20, 180), rand(-60, 60), rand(-120, -20), rand(1, 3), pick(['#ffd23f', '#4cc9f0', '#ef476f', '#7bf1a8']), rand(1.2, 2.2), 160, false);
  }
}

/* ------------------------------------------------------------
   Player update
   ------------------------------------------------------------ */

function tryDash() {
  const p = game.player;
  if (!p || p.dead || game.state !== 'play') return;
  if (p.dashCd > 0 || p.dashT > 0) return;
  const left = keys.has('KeyA') || keys.has('ArrowLeft');
  const right = keys.has('KeyD') || keys.has('ArrowRight');
  p.dashDir = left && !right ? -1 : right && !left ? 1 : p.facing;
  p.dashT = PLAYER_TUNE.dashTime;
  p.dashCd = PLAYER_TUNE.dashCooldown;
  p.invuln = Math.max(p.invuln, PLAYER_TUNE.dashTime + 0.08);
  p.vx = p.dashDir * PLAYER_TUNE.dashSpeed;
  AudioSys.dash();
  for (let i = 0; i < 8; i++) {
    addParticle(p.x + p.w / 2, p.y + rand(2, 16), rand(-30, 30) - p.dashDir * 60, rand(-20, 20), rand(1, 3), '#4cc9f0', 0.3, 0, true);
  }
}

function updatePlayer(dt) {
  const p = game.player;
  if (!p || p.dead) return;
  p.fireCd = Math.max(0, p.fireCd - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.recoil = Math.max(0, p.recoil - dt * 24);
  p.muzzleT = Math.max(0, p.muzzleT - dt);
  p.jumpBuf = Math.max(0, p.jumpBuf - dt);

  const shoulderX = p.x + p.w / 2;
  const shoulderY = p.y + 8;
  game.aim.x = mouse.x + game.cam;
  game.aim.y = mouse.y;
  p.aim = Math.atan2(game.aim.y - shoulderY, game.aim.x - shoulderX);
  p.facing = Math.cos(p.aim) >= 0 ? 1 : -1;

  if (p.dashT > 0) {
    p.dashT -= dt;
    p.x += p.dashDir * PLAYER_TUNE.dashSpeed * dt;
    p.x = clamp(p.x, 2, game.floor.width - p.w - 2);
    if (game.t % 0.03 < dt) {
      game.ghosts.push({ x: p.x, y: p.y, facing: p.facing, life: 0.22, max: 0.22 });
    }
    if (p.dashT <= 0) p.vx *= 0.7;
    p.onGround = p.y + p.h >= GROUND_Y - 1;
    if (p.y + p.h > GROUND_Y) p.y = GROUND_Y - p.h;
  } else {
    const left = keys.has('KeyA') || keys.has('ArrowLeft');
    const right = keys.has('KeyD') || keys.has('ArrowRight');
    const dir = (right ? 1 : 0) - (left ? 1 : 0);
    const accel = p.onGround ? PLAYER_TUNE.accel : PLAYER_TUNE.airAccel;

    if (dir !== 0) {
      p.vx = approach(p.vx, dir * PLAYER_TUNE.speed, accel * dt);
      p.facing = dir;
    } else {
      p.vx = approach(p.vx, 0, (p.onGround ? PLAYER_TUNE.friction : PLAYER_TUNE.airAccel * 0.45) * dt);
    }

    if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0)) {
      p.vy = -PLAYER_TUNE.jump;
      p.onGround = false;
      p.coyote = 0;
      p.jumpBuf = 0;
      AudioSys.jump();
      for (let i = 0; i < 6; i++) {
        addParticle(p.x + p.w / 2 + rand(-5, 5), p.y + p.h - 1, rand(-35, 35), rand(-12, 4), rand(1, 2), '#9ea7c9', 0.3, 220, false);
      }
    }

    const wasGround = p.onGround;
    const fallVy = p.vy;
    moveBody(p, dt, 1);
    if (!wasGround && p.onGround && fallVy > 180) {
      AudioSys.land();
      for (let i = 0; i < 7; i++) {
        addParticle(p.x + p.w / 2 + rand(-6, 6), p.y + p.h - 1, rand(-45, 45), rand(-20, 2), rand(1, 2), '#9ea7c9', 0.28, 160, false);
      }
    }
    p.coyote = p.onGround ? 0.1 : Math.max(0, p.coyote - dt);
    if (p.onGround) p.walkT += Math.abs(p.vx) * dt * 0.085;
  }

  if ((mouse.down || keys.has('KeyJ')) && p.fireCd <= 0) shoot();
}

/* ------------------------------------------------------------
   Physics helpers
   ------------------------------------------------------------ */

function moveBody(e, dt, gravityScale) {
  const g = (gravityScale == null ? 1 : gravityScale);
  const prevBottom = e.y + e.h;
  e.vy += PLAYER_TUNE.gravity * g * dt;
  if (e.vy > PLAYER_TUNE.maxFall) e.vy = PLAYER_TUNE.maxFall;
  e.x += e.vx * dt;
  e.x = clamp(e.x, 0, game.floor.width - e.w);
  e.y += e.vy * dt;
  e.onGround = false;

  if (e.y + e.h >= GROUND_Y && e.vy >= 0) {
    e.y = GROUND_Y - e.h;
    e.vy = 0;
    e.onGround = true;
  }

  if (e.vy >= 0) {
    const plats = game.floor.platforms;
    for (let i = 0; i < plats.length; i++) {
      const p = plats[i];
      if (e.x + e.w <= p.x + 1 || e.x >= p.x + p.w - 1) continue;
      if (prevBottom <= p.y + 1 && e.y + e.h >= p.y) {
        e.y = p.y - e.h;
        e.vy = 0;
        e.onGround = true;
      }
    }
  }
}

function segRectT(x1, y1, x2, y2, rx, ry, rw, rh) {
  let tmin = 0;
  let tmax = 1;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const p = [-dx, dx, -dy, dy];
  const q = [x1 - rx, rx + rw - x1, y1 - ry, ry + rh - y1];
  for (let i = 0; i < 4; i++) {
    if (Math.abs(p[i]) < 1e-9) {
      if (q[i] < 0) return null;
    } else {
      const t = q[i] / p[i];
      if (p[i] < 0) {
        if (t > tmin) tmin = t;
      } else if (t < tmax) {
        tmax = t;
      }
      if (tmin > tmax) return null;
    }
  }
  return tmin;
}

function lineBlocked(x1, y1, x2, y2) {
  const end = rayEnd(x1, y1, x2, y2);
  return dist(x1, y1, end.x, end.y) < dist(x1, y1, x2, y2) - 3;
}

function rayEnd(x1, y1, x2, y2) {
  let best = 1;
  const plats = game.floor.platforms;
  for (let i = 0; i < plats.length; i++) {
    const p = plats[i];
    const t = segRectT(x1, y1, x2, y2, p.x, p.y, p.w, p.h);
    if (t != null && t > 0.001 && t < best) best = t;
  }
  const tg = segRectT(x1, y1, x2, y2, 0, GROUND_Y, game.floor.width, 38);
  if (tg != null && tg > 0.001 && tg < best) best = tg;
  return { x: lerp(x1, x2, best), y: lerp(y1, y2, best), t: best };
}

/* ------------------------------------------------------------
   Weapons / shooting
   ------------------------------------------------------------ */

function randomDrop() {
  let total = 0;
  for (let i = 0; i < DROP_TABLE.length; i++) total += DROP_TABLE[i].weight;
  let r = Math.random() * total;
  for (let i = 0; i < DROP_TABLE.length; i++) {
    r -= DROP_TABLE[i].weight;
    if (r <= 0) return DROP_TABLE[i].w;
  }
  return 'shotgun';
}

function setWeapon(name) {
  const p = game.player;
  const def = WEAPONS[name];
  if (!def) return;
  if (name === 'pistol') {
    p.weapon = 'pistol';
    p.ammo = Infinity;
    return;
  }
  if (p.weapon === name) {
    p.ammo += Math.ceil(def.ammo * 0.5);
  } else {
    p.weapon = name;
    p.ammo = def.ammo;
  }
}

function healPlayer(n) {
  const p = game.player;
  const before = p.hp;
  p.hp = Math.min(p.maxHp, p.hp + n);
  if (p.hp > before) {
    AudioSys.health();
    addText('+1 HP', p.x + 4, p.y - 10, '#7bf1a8', 1);
    game.pot += 15;
  } else {
    game.pot += 40;
    addText('+40', p.x + 4, p.y - 10, '#ffd23f', 1);
  }
}

function shoot() {
  const p = game.player;
  if (!p || p.dead) return;
  let def = WEAPONS[p.weapon] || WEAPONS.pistol;
  if (p.ammo <= 0) {
    setWeapon('pistol');
    def = WEAPONS.pistol;
    AudioSys.empty();
    addText('OUT OF AMMO', p.x, p.y - 12, '#8a8aa8', 1);
  }

  const sx = p.x + p.w / 2;
  const sy = p.y + 8;
  const angle = p.aim;
  const muzzleDist = def.shape === 'rail' ? 15 : def.shape === 'shotgun' ? 12 : def.shape === 'rocket' ? 13 : 9;
  const mx = sx + Math.cos(angle) * muzzleDist;
  const my = sy + Math.sin(angle) * muzzleDist;

  p.fireCd = def.rate;
  p.muzzleT = 0.065;
  p.recoil = 1;
  if (p.ammo !== Infinity) p.ammo--;

  if (def.hitscan) {
    fireRail(mx, my, angle);
  } else {
    const count = def.pellets || 1;
    for (let i = 0; i < count; i++) {
      const a = angle + rand(-def.spread, def.spread) + (count > 1 ? rand(-0.02, 0.02) : 0);
      game.bullets.push({
        x: mx, y: my, px: mx, py: my,
        vx: Math.cos(a) * def.speed,
        vy: Math.sin(a) * def.speed,
        r: def.shape === 'rocket' ? 4 : 2,
        dmg: def.dmg,
        color: def.color,
        weapon: p.weapon,
        explosive: def.explosive || 0,
        life: def.shape === 'rocket' ? 2.4 : 1.5,
        dead: false,
      });
    }
  }

  for (let i = 0; i < 4; i++) {
    addParticle(mx, my, Math.cos(angle) * rand(30, 130) + rand(-40, 40), Math.sin(angle) * rand(30, 130) + rand(-40, 40), rand(1, 3), def.color, rand(0.08, 0.2), 60, true);
  }
  if (p.weapon === 'pistol' || p.weapon === 'shotgun' || p.weapon === 'smg') {
    const side = angle + Math.PI / 2;
    addParticle(sx, sy, Math.cos(side) * rand(20, 55) - Math.cos(angle) * 30, Math.sin(side) * rand(20, 55) - Math.sin(angle) * 30, 1, '#ffd23f', 0.4, 420, false);
  }
  AudioSys.shoot(def.sfx);
  game.shake = Math.max(game.shake, def.shape === 'shotgun' ? 3.2 : def.shape === 'rocket' ? 4.5 : 1.3);
  p.vx -= Math.cos(angle) * (def.shape === 'shotgun' ? 38 : def.shape === 'rocket' ? 45 : 5);
}

function fireRail(mx, my, angle) {
  const farX = mx + Math.cos(angle) * 900;
  const farY = my + Math.sin(angle) * 900;
  const end = rayEnd(mx, my, farX, farY);
  const hits = [];

  for (let i = 0; i < game.enemies.length; i++) {
    const e = game.enemies[i];
    if (e.dead || e.spawnT > 0) continue;
    const t = segRectT(mx, my, end.x, end.y, e.x, e.y, e.w, e.h);
    if (t != null) hits.push({ t, e });
  }
  if (game.boss && !game.boss.dead && game.boss.spawnT <= 0) {
    const b = game.boss;
    const t = segRectT(mx, my, end.x, end.y, b.x, b.y, b.w, b.h);
    if (t != null) hits.push({ t, boss: true });
  }
  hits.sort((a, b) => a.t - b.t);

  for (let i = 0; i < hits.length; i++) {
    const h = hits[i];
    if (h.boss) damageBoss(game.boss, WEAPONS.rail.dmg, true);
    else damageEnemy(h.e, WEAPONS.rail.dmg, { ignoreShield: true, fromX: mx, fromY: my });
    addParticle(lerp(mx, end.x, h.t), lerp(my, end.y, h.t), rand(-40, 40), rand(-40, 40), rand(1, 3), '#e0aaff', 0.3, 0, true);
  }

  game.beams.push({ x1: mx, y1: my, x2: end.x, y2: end.y, t: 0.18, max: 0.18, color: '#c77dff', width: 4 });
  game.beams.push({ x1: mx, y1: my, x2: end.x, y2: end.y, t: 0.1, max: 0.1, color: '#ffffff', width: 1 });
  for (let i = 0; i < 18; i++) {
    const t = rand(0.05, 1);
    addParticle(lerp(mx, end.x, t), lerp(my, end.y, t), rand(-25, 25), rand(-25, 25), rand(1, 2), '#c77dff', rand(0.15, 0.4), 60, true);
  }
  game.flash = 0.18;
  game.flashColor = '#c77dff';
  game.shake = Math.max(game.shake, 5);
  game.hitstop = 0.025;
  AudioSys.beam();
}
